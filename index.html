<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Version Control Simulation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f4f7fb;
      color: #333;
    }
    .container {
      max-width: 800px;
      padding: 2rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
    }
    h1 {
      margin-top: 0;
      color: #1a73e8;
    }
    p {
      line-height: 1.6;
    }
    .actions {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
    }
    .actions button {
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: white;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .actions button:hover {
      background: #1558b0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Version Control Simulation</h1>
    <p>This is a simple HTML landing page for a version control simulation project. Use this page as a starting point for your web interface.</p>
    <div class="actions">
      <button type="button">Initialize Repo</button>
      <button type="button">Commit Changes</button>
      <button type="button">View History</button>
    </div>
  </div>
  <p>this added code for footer branchhhhh</p>
</body>
</html>
